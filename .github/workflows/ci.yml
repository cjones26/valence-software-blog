name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Type errors fail this too (Next.js type-checks the whole project as
      # part of `next build`), so a separate `typecheck` step here would be
      # redundant with `build` and would also break on `tsc --noEmit` alone:
      # `contentlayer/generated` doesn't exist until contentlayer2's codegen
      # runs, which only happens as the first half of the `build` script.
      - run: npm run build
